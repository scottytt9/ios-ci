name: Interlude
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.2"
    CURRENT_PROJECT_VERSION: "14"
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    exactVersion: 2.19.0
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 150.0.0
targets:
  Interlude:
    type: application
    platform: iOS
    sources:
      - Interlude
      - path: Vendor/MobileVLCKit-LICENSE.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.interlude.ios
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "IconMono IconBlue IconPlum IconEmber IconGold"
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS: "$(inherited) -lz"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/InterludeZlib"
    dependencies:
      - package: LiveKit
        product: LiveKit
      - package: WebRTC
        product: WebRTC
      - framework: Vendor/MobileVLCKit.xcframework
        embed: true
      - framework: Vendor/InterludeCoreFFI.xcframework
        embed: false
