name: Build iPhone IPA
on:
  push:
    paths: ['ios/**', 'crates/**', 'scripts/build-ios-core.sh', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ipa:
    runs-on: macos-26-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
      - name: Test shared Rust core
        run: cargo test -p interlude-core
      - name: Build shared Rust core XCFramework and Swift bindings
        run: bash scripts/build-ios-core.sh
      - name: Install project generator
        run: brew install xcodegen
      - name: Prepare the iPhone compatibility player
        run: bash ios/prepare-vlc.sh
      - name: Test room codes, profiles, playback rules and artwork sizes
        run: |
          swiftc -swift-version 5 -I ios/InterludeZlib ios/Interlude/RoomInvite.swift ios/Interlude/VoiceFrames.swift \
            ios/Interlude/History.swift ios/Interlude/Profile.swift ios/Interlude/RoomTitle.swift ios/Interlude/ExternalCaptions.swift \
            ios/Interlude/PlaybackTimeline.swift ios/Interlude/PlaybackFailure.swift ios/Interlude/RoomPlaybackTiming.swift \
            ios/Interlude/ArtworkRequest.swift ios/Tests/ProtocolTests.swift -lz -o "$RUNNER_TEMP/interlude-tests"
          "$RUNNER_TEMP/interlude-tests" ios/Tests/Fixtures/profile-code.txt
      - name: Build an unsigned device app
        run: |
          cd ios
          xcodegen generate
          xcodebuild -project Interlude.xcodeproj -scheme Interlude -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/Interlude-build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package the IPA
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$RUNNER_TEMP/Interlude-build/Build/Products/Release-iphoneos/Interlude.app" "$RUNNER_TEMP/ipa/Payload/Interlude.app"
          lipo "$RUNNER_TEMP/ipa/Payload/Interlude.app/Interlude" -verify_arch arm64
          lipo "$RUNNER_TEMP/ipa/Payload/Interlude.app/Frameworks/WebRTC.framework/WebRTC" -verify_arch arm64
          lipo "$RUNNER_TEMP/ipa/Payload/Interlude.app/Frameworks/MobileVLCKit.framework/MobileVLCKit" -verify_arch arm64
          ditto -c -k --keepParent "$RUNNER_TEMP/ipa/Payload" "$RUNNER_TEMP/ipa/Interlude-iOS.ipa"
          unzip -tq "$RUNNER_TEMP/ipa/Interlude-iOS.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: Interlude-iOS
          path: ${{ runner.temp }}/ipa/Interlude-iOS.ipa
          if-no-files-found: error
